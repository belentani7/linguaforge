<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manos Abiertas - Cargando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 28px; margin-bottom: 10px; }
    .subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 30px; }
    .status-list {
      text-align: left;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.8;
    }
    .status { margin: 8px 0; display: flex; align-items: center; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 10px;
      background: #fbbf24;
    }
    .dot.ok { background: #10b981; }
    .dot.error { background: #ef4444; }
    .error-msg { color: #fca5a5; margin-top: 30px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Manos Abiertas</h1>
    <p class="subtitle">Conectando a servidores...</p>
    <div class="status-list" id="statusList">
      <div class="status"><div class="dot"></div>Verificando Vercel...</div>
      <div class="status"><div class="dot"></div>Verificando Netlify...</div>
      <div class="status"><div class="dot"></div>Verificando Surge...</div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const URLS = [
      { name: 'Vercel', url: 'https://manos-abiertas-belentani.vercel.app' },
      { name: 'Netlify', url: 'https://manos-abiertas-belentani.netlify.app' },
      { name: 'Surge', url: 'https://manos-abiertas-belentani.surge.sh' },
    ];

    const statusEl = document.getElementById('statusList');
    const errorEl = document.getElementById('errorMsg');

    async function tryUrl(url, timeout = 3000) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);

        const response = await fetch(url, {
          method: 'HEAD',
          signal: controller.signal,
          mode: 'no-cors'
        });

        clearTimeout(timeoutId);
        return true;
      } catch {
        return false;
      }
    }

    async function findAlive() {
      for (let i = 0; i < URLS.length; i++) {
        const { name, url } = URLS[i];
        const li = statusEl.children[i];

        if (await tryUrl(url)) {
          li.querySelector('.dot').className = 'dot ok';
          li.querySelector('.dot').style.background = '#10b981';
          // Redirect after brief delay
          setTimeout(() => window.location.href = url, 500);
          return;
        } else {
          li.querySelector('.dot').className = 'dot error';
          li.querySelector('.dot').style.background = '#ef4444';
        }
      }

      // All failed
      errorEl.textContent = 'No hay servidores disponibles. Intenta en unos minutos.';
    }

    findAlive();
  </script>
</body>
</html>
