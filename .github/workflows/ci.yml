name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Lint
        run: pnpm run lint
      - name: Tests
        run: pnpm run test
      - name: Build
        run: pnpm run build

  education-contract:
    name: Validate education contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test contract validator
        run: node --test scripts/verify-education-contract.test.mjs
      - name: Validate project ledger
        run: node scripts/verify-education-contract.mjs

  mysql-persistence:
    name: MySQL persistence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: linguaforge_test
          MARIADB_USER: lf_test
          MARIADB_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run persistence contracts against isolated MariaDB
        run: pnpm exec vitest run tests/persistence.test.ts tests/store-atomic.test.ts
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: mysql://lf_test:test-only-password@127.0.0.1:3306/linguaforge_test

  browser-flows:
    name: Browser navigation and storage recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install application
        run: pnpm install --frozen-lockfile
      - name: Build production frontend
        run: pnpm build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/lf-browser" --no-save --no-package-lock --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/lf-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Start complete application
        run: |
          NODE_ENV=production PORT=4173 SESSION_SECRET=ci-only-session-secret-with-at-least-32-characters LF_DATA_FILE="$RUNNER_TEMP/lf-ui-data.json" pnpm exec tsx server/index.ts > "$RUNNER_TEMP/lf-ui-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/lf-ui-server.log"
          exit 1
      - name: Verify mobile, keyboard and restricted storage flows
        run: node scripts/check-browser-flows.mjs
        env:
          PLAYWRIGHT_MODULE_URL: file://${{ runner.temp }}/lf-browser/node_modules/playwright/index.mjs
          UI_BASE_URL: http://127.0.0.1:4173
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-flow-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
