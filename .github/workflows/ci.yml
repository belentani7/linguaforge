name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # lee la versión de package.json (packageManager)
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm coverage # falla si la cobertura baja del umbral de vitest.config.ts
      - run: pnpm build
      - run: pnpm bundle:check # falla si el JS inicial supera el presupuesto

  # Pruebas de persistencia contra MariaDB efímera (servicio del runner, sin datos reales).
  # Credenciales de este servicio: sólo existen dentro del job de CI.
  persistence:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root
          MARIADB_DATABASE: linguaforge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/linguaforge_test
      TEST_DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/linguaforge_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migraciones, rollback y seed sobre la base de prueba
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:rollback -- --confirm
          pnpm db:migrate
      - name: Pruebas de persistencia (contrato, integridad, rollback)
        run: npx vitest run tests/persistence.test.ts
