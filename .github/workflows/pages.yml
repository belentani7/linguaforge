name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo contenido estatico: se excluye node_modules, server, client, src.
      - name: Preparar sitio estatico
        run: |
          mkdir -p _site
          for d in index.html campus open-data public docs magic assets styles images; do
            if [ -e "$d" ]; then cp -r "$d" _site/; fi
          done
          echo "--- _site ---"; ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
